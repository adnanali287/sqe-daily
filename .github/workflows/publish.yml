name: Publish daily practice
on:
  push:
    branches: [main]
    paths: ['content/questions.json', 'scripts/**', 'assets/**', '.github/workflows/publish.yml', 'CNAME', '.nojekyll']
  workflow_dispatch:
  schedule:
    - cron: '5 23 * * *'
    - cron: '5 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sqe-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Both UTC candidates run; only the London-midnight candidate publishes.
      # Checking the scheduled hour rather than actual minute tolerates queue delays.
      - name: Resolve BST or GMT schedule
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          offset = datetime.now(ZoneInfo('Europe/London')).utcoffset().total_seconds()
          hour = int(os.environ['SCHEDULE'].split()[1]) if os.environ['EVENT'] == 'schedule' else -1
          valid = os.environ['EVENT'] != 'schedule' or hour == (23 if offset else 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(valid).lower()}\n')
          PY
      - if: steps.clock.outputs.run == 'true'
        run: python scripts/generate.py --package
      - if: steps.clock.outputs.run == 'true'
        run: python scripts/test_site.py
      - if: steps.clock.outputs.run == 'true'
        run: node scripts/test_dates.cjs
      - if: steps.clock.outputs.run == 'true'
        run: npx --yes html-validate@11.16.2 '_site/**/*.html'
      - name: Commit generated pages
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html q archive about sponsor privacy sitemap.xml feed.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish dated SQE Daily questions'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.clock.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.run == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.clock.outputs.run == 'true'
        id: deploy
